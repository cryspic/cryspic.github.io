<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cristian Figura · portfolio</title>
<meta name="description" content="Portfolio di Cristian Figura, graphic designer: branding, editoria, 3D, interfacce, visual design e video.">
<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,0..100&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<script>
/* tema: scelta salvata, altrimenti quella del dispositivo. Eseguito subito per evitare lampi. */
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* Struttura: barra in alto, hero con nome e collage, sei sezioni numerate (testo a sinistra, progetti a destra),
   profilo, contatti. Ogni progetto ha la sua pagina (#slug). Chiaro e scuro con le stesse gerarchie. */
:root {
  --bg: #faf8f4; --surface: #ffffff; --fg: #161616; --muted: #5b5b60; --line: #e2ded4; --hover: #f0ece3;
  --accent: #1b2a6b; --blob: #1b2a6b; --on-accent: #ffffff;
  --shadow: 0 10px 28px rgba(22,22,22,.10);
  --display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --text: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --gl: max(20px, env(safe-area-inset-left, 0px)); --gr: max(20px, env(safe-area-inset-right, 0px));
  --maxw: 1320px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #141414; --surface: #1e1e20; --fg: #ececec; --muted: #a8a8ae; --line: #333337; --hover: #26262a;
  --accent: #9fb0ff; --blob: #2a3a8f; --on-accent: #101010;
  --shadow: 0 12px 30px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
h1, h2, h3, p, figure, dl, dd { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-left: var(--gl); padding-right: var(--gr); }
.serif { font-family: var(--display); font-variation-settings: "SOFT" 0, "opsz" 72; }

/* barra */
.bar { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar-in { max-width: var(--maxw); margin: 0 auto; display: flex; align-items: center; gap: 18px; padding: 10px var(--gr) 10px var(--gl); }
.mark { font-weight: 700; font-size: .95rem; white-space: nowrap; }
.mark span { color: var(--muted); font-weight: 400; }
.bar nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; min-width: 0; scrollbar-width: none; }
.bar nav::-webkit-scrollbar { display: none; }
.bar nav a { position: relative; white-space: nowrap; font-size: .82rem; font-weight: 500; padding: 9px 11px; color: var(--muted); border-radius: 99px; transition: color .2s, background .2s; }
.bar nav a:hover { color: var(--fg); background: var(--hover); }
.bar nav a.is-active { color: var(--fg); }
.bar nav a.is-active::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.back { margin-left: auto; font-size: .82rem; font-weight: 700; letter-spacing: .04em; padding: 9px 16px; border: 1px solid var(--line); border-radius: 99px; transition: background .2s, transform .2s; }
.back:hover { background: var(--hover); transform: translateX(-3px); }
.theme { flex: none; width: 44px; height: 44px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: none; cursor: pointer; transition: background .2s, transform .3s; }
.theme:hover { background: var(--hover); transform: rotate(18deg); }
.theme svg { width: 20px; height: 20px; }
.theme .moon { display: none; }
:root[data-theme="dark"] .theme .sun { display: none; }
:root[data-theme="dark"] .theme .moon { display: block; }

/* hero */
.hero { padding-top: clamp(32px, 6vw, 80px); padding-bottom: clamp(40px, 7vw, 96px); }
.hero-in { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(32px, 5vw, 80px); align-items: center; }
.hero h1 { font-family: var(--display); font-weight: 500; font-variation-settings: "SOFT" 0, "opsz" 144; font-size: clamp(3.1rem, 8.4vw, 7.6rem); line-height: .93; letter-spacing: -.015em; text-transform: uppercase; color: var(--accent); }
.hero .kind { margin-top: 14px; font-family: var(--display); font-weight: 300; font-size: clamp(1.4rem, 3vw, 2.4rem); letter-spacing: .32em; }
.hero .lead { margin-top: clamp(20px, 3vw, 34px); max-width: 46ch; color: var(--muted); font-size: 1.08rem; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: clamp(24px, 3.4vw, 40px); }
.chips a { position: relative; font-size: .92rem; font-weight: 500; padding: 6px 0; color: var(--muted); transition: color .2s; }
.chips a::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .3s ease; }
.chips a:hover { color: var(--fg); }
.chips a:hover::after { transform: scaleX(1); }
.scroll { display: inline-flex; align-items: center; gap: 10px; margin-top: clamp(28px, 4vw, 48px); font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.scroll i { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; font-style: normal; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

.collage { position: relative; isolation: isolate; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 4% 0; }
.collage::before { content: ""; position: absolute; z-index: -1; inset: 2% -6% 4% 14%; background: var(--blob); border-radius: 58% 42% 52% 48% / 46% 56% 44% 54%; opacity: .92; }
.collage .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.collage .col:nth-child(2) { margin-top: 12%; }
.collage a { display: block; overflow: hidden; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); transition: transform .4s ease, box-shadow .4s ease; }
.collage a:hover { transform: translateY(-6px) rotate(-.6deg); }
.collage img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }

/* sezioni */
.sec { border-top: 1px solid var(--line); padding: clamp(40px, 6vw, 88px) 0; }
.sec-in { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: clamp(24px, 4vw, 64px); align-items: start; }
.sec-head { position: sticky; top: 92px; align-self: start; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.sec-head .num { font-size: .82rem; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.sec-head h2 { font-family: var(--display); font-weight: 500; font-variation-settings: "SOFT" 0, "opsz" 96; font-size: clamp(2rem, 3.4vw, 3rem); line-height: 1.04; letter-spacing: -.01em; color: var(--c); text-wrap: balance; }
.sec-head p { color: var(--muted); font-size: .98rem; max-width: 30ch; }
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 20px; border: 1.5px solid var(--c); border-radius: 3px; background: var(--c); color: var(--on-c); font-size: .74rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, background .2s, color .2s; }
.btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px color-mix(in srgb, var(--c) 30%, transparent); }
.btn:active { transform: translateY(0); box-shadow: none; }
.btn.ghost { background: none; color: var(--c); }
.btn.ghost:hover { background: var(--c); color: var(--on-c); }
.btn .arr { transition: transform .25s ease; }
.btn:hover .arr { transform: translateX(5px); }
.sec[data-s="branding"] { --c: #1b2a6b; --on-c: #fff; }
.sec[data-s="editoria"] { --c: #b45500; --on-c: #fff; }
.sec[data-s="3d"] { --c: #08704d; --on-c: #fff; }
.sec[data-s="digital"] { --c: #a31128; --on-c: #fff; }
.sec[data-s="visual"] { --c: #740677; --on-c: #fff; }
.sec[data-s="video"] { --c: #a8166f; --on-c: #fff; }
:root[data-theme="dark"] .sec[data-s="branding"] { --c: #9fb0ff; --on-c: #10142e; }
:root[data-theme="dark"] .sec[data-s="editoria"] { --c: #ff9a3d; --on-c: #241200; }
:root[data-theme="dark"] .sec[data-s="3d"] { --c: #4fcf9b; --on-c: #06251a; }
:root[data-theme="dark"] .sec[data-s="digital"] { --c: #ff7186; --on-c: #2b0610; }
:root[data-theme="dark"] .sec[data-s="visual"] { --c: #e08ee6; --on-c: #2a0a2c; }
:root[data-theme="dark"] .sec[data-s="video"] { --c: #ff7cc4; --on-c: #2d0720; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: clamp(18px, 2.4vw, 32px); }
.card { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card .lbl { display: flex; align-items: baseline; gap: 10px; font-size: .86rem; font-weight: 700; }
.card .lbl small { color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .08em; }
.card .lbl em { margin-left: auto; font-style: normal; color: var(--muted); font-weight: 500; font-size: .76rem; }
.card .shot { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 0 rgba(0,0,0,.02); transition: transform .35s ease, box-shadow .35s ease, border-color .35s; }
.card .shot img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .8s ease; }
a.card:hover .shot, a.card:focus-visible .shot { transform: translateY(-6px); box-shadow: var(--shadow); border-color: var(--c); }
a.card:hover .shot img { transform: scale(1.05); }
.card .badge { position: absolute; left: 12px; top: 12px; padding: 6px 10px; border-radius: 99px; background: rgba(15,15,17,.82); color: #f4f4f4; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.card .badge.live { background: var(--c); color: var(--on-c); }
.card p { color: var(--muted); font-size: .9rem; line-height: 1.4; }
.card.soon .shot { display: grid; place-items: center; aspect-ratio: 4 / 3; border-style: dashed; background: none; color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

/* profilo */
.profile { border-top: 1px solid var(--line); padding: clamp(40px, 6vw, 88px) 0; }
.profile h2, .contact h2 { font-family: var(--display); font-weight: 500; font-variation-settings: "SOFT" 0, "opsz" 144; line-height: 1; letter-spacing: -.01em; }
.profile .sec-head h2 { color: var(--fg); }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(28px, 4vw, 56px) clamp(24px, 3vw, 48px); }
.pgrid h3 { font-size: .74rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.pgrid .wide { grid-column: span 2; }
.pgrid p { max-width: 60ch; }
.pgrid p + p { margin-top: 12px; }
.role { font-family: var(--display); font-weight: 500; font-size: clamp(1.5rem, 2.6vw, 2.1rem); line-height: 1.1; margin-bottom: 14px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { padding: 14px 0; border-top: 1px solid var(--line); }
.tl li:first-child { padding-top: 0; border-top: 0; }
.tl .y { display: block; font-size: .78rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl b { display: block; font-family: var(--display); font-weight: 600; font-size: 1.08rem; line-height: 1.25; }
.tl span.d { color: var(--muted); font-size: .9rem; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags span { padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: .88rem; font-weight: 500; background: var(--surface); }
.contact { border-top: 1px solid var(--line); padding: clamp(48px, 8vw, 112px) 0 clamp(40px, 6vw, 72px); }
.contact h2 { font-size: clamp(2.6rem, 7.6vw, 6.4rem); max-width: 14ch; }
.contact .row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-top: clamp(24px, 4vw, 44px); }
.contact .mail { font-family: var(--display); font-weight: 500; font-size: clamp(1.3rem, 3vw, 2rem); overflow-wrap: anywhere; color: var(--accent); border-bottom: 2px solid currentColor; }
.contact .btn { --c: var(--fg); --on-c: var(--bg); }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding-top: 28px; margin-top: clamp(40px, 6vw, 80px); border-top: 1px solid var(--line); color: var(--muted); font-size: .84rem; }

/* pagina progetto */
.phead { background: var(--c); color: var(--ink); padding: clamp(32px, 6vw, 80px) 0 clamp(32px, 5vw, 64px); }
.phead .cat { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.phead h1 { margin-top: 14px; font-family: var(--display); font-weight: 500; font-variation-settings: "SOFT" 0, "opsz" 144; font-size: clamp(2.6rem, 8.5vw, 6.6rem); line-height: .98; letter-spacing: -.015em; text-wrap: balance; }
.phead p { margin-top: clamp(18px, 3vw, 32px); max-width: 62ch; font-size: clamp(1.05rem, 1.8vw, 1.3rem); line-height: 1.5; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 32px; margin-top: 26px; font-size: .9rem; }
.facts dt { font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .78; }
.facts dd { margin: 2px 0 0; font-weight: 500; }
.cta { display: inline-flex; align-items: center; gap: 12px; margin-top: 30px; padding: 15px 24px; border-radius: 3px; background: var(--ink); color: var(--c); font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; transition: transform .2s ease, box-shadow .2s ease; }
.cta:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,.28); }
.cta .arr { transition: transform .25s; }
.cta:hover .arr { transform: translateX(5px); }
.try { padding-top: clamp(28px, 5vw, 64px); }
.try-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.try-head h2 { font-family: var(--display); font-weight: 500; font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.1; }
.try-head p { color: var(--muted); max-width: 52ch; margin-top: 6px; }
.try-head a { font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 11px 16px; border: 1px solid var(--line); border-radius: 99px; transition: background .2s; }
.try-head a:hover { background: var(--hover); }
.frame { margin: 0 auto; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.frame iframe { display: block; width: 100%; height: 100%; border: 0; }
.frame--phone { width: min(100%, 400px); height: min(820px, calc(100svh - 96px)); min-height: 560px; border-radius: 22px; }
.frame--site { width: 100%; height: min(78vh, 780px); min-height: 520px; border-radius: 10px; }
.gallery { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(16px, 2.5vw, 32px); padding: clamp(28px, 4vw, 56px) 0; }
.gallery button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); cursor: zoom-in; }
.gallery img { display: block; width: 100%; height: auto; }
.parts { padding-bottom: clamp(28px, 4vw, 56px); }
.parts h2 { font-family: var(--display); font-weight: 500; font-size: clamp(1.6rem, 3vw, 2.4rem); margin-bottom: 18px; }
.pgal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.pgal figure { margin: 0; }
.pgal button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #000; cursor: zoom-in; transition: transform .3s ease, box-shadow .3s ease; }
.pgal button:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.pgal img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.pgal figcaption { margin-top: 8px; font-size: .84rem; color: var(--muted); }
.next { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding-bottom: clamp(48px, 8vw, 96px); }
.next a { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; padding: 20px; border: 1px solid var(--line); border-radius: 6px; transition: background .2s, transform .2s; }
.next a:hover { background: var(--hover); transform: translateY(-3px); }
.next small { font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.next b { font-family: var(--display); font-weight: 600; font-size: 1.5rem; line-height: 1.1; }
.next .r { text-align: right; }

.lb { position: fixed; inset: 0; z-index: 50; background: rgba(12,12,14,.95); display: none; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gr) max(16px, env(safe-area-inset-bottom, 0px)) var(--gl); }
.lb[data-open="true"] { display: flex; }
.lb img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.lb button { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); background: #ececec; color: #161616; border: 0; border-radius: 99px; font: 700 .8rem var(--text); letter-spacing: .06em; text-transform: uppercase; padding: 10px 16px; cursor: pointer; }

@media (max-width: 980px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); }
  .collage { max-width: 640px; }
  .sec-in { grid-template-columns: minmax(0, 1fr); }
  .sec-head { position: static; }
  .pgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pgrid .wide { grid-column: 1 / -1; }
}
@media (max-width: 600px) {
  .pgrid { grid-template-columns: minmax(0, 1fr); }
  .mark span { display: none; }
  .bar-in { gap: 8px; }
  .collage { gap: 10px; }
  .collage .col { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">Per vedere il portfolio serve JavaScript.</p></noscript>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Immagine ingrandita">
  <img id="lbimg" alt="">
  <button type="button" id="lbclose">Chiudi</button>
</div>

<script>
/* ===================== CONTENUTI: qui si aggiungono e si cambiano i progetti ===================== */
var EMAIL = 'crys.figura@gmail.com';

/* Le sei sezioni della home, nell'ordine in cui compaiono. */
var SECTIONS = [
  { id: 'branding', n: '01', nav: 'Branding', name: 'Branding e identità visiva', line: 'Sistemi visivi coordinati, dal concept alle applicazioni fisiche e digitali.', cta: 'Scopri i progetti' },
  { id: 'editoria', n: '02', nav: 'Editoria', name: 'Editoria', line: 'Libri che uniscono contenuto, forma e tipografia per raccontare storie e idee.', cta: 'Vedi i progetti' },
  { id: '3d', n: '03', nav: '3D', name: '3D Design', line: 'Dalla modellazione alla renderizzazione: arredamento e prodotto.', cta: 'Scopri di più' },
  { id: 'digital', n: '04', nav: 'Digital', name: 'Digital', line: 'Interfacce digitali intuitive e orientate all’esperienza.', cta: 'Vedi il progetto' },
  { id: 'visual', n: '05', nav: 'Visual', name: 'Visual Design', line: 'Comunicazione visiva per il digitale, la stampa e l’arte visiva.', cta: 'Scopri di più' },
  { id: 'video', n: '06', nav: 'Video', name: 'Video Editing', line: 'Ripresa e montaggio di performance dal vivo e di contenuti per prodotto.', cta: 'Guarda i lavori' }
];
/* Colori delle pagine progetto (quelli del PDF). ink = colore del testo sopra la fascia. */
var BANDS = {
  branding: { c: '#1e2144', ink: '#f1f1f1' }, editoria: { c: '#d46901', ink: '#1e1e1e' },
  '3d': { c: '#08704d', ink: '#f1f1f1' }, digital: { c: '#a31128', ink: '#f1f1f1' },
  social: { c: '#740677', ink: '#f1f1f1' }, fotoritocco: { c: '#0b7480', ink: '#f1f1f1' },

function setActive() {

  ids.forEach(function (id) { var el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= 140) cur = id; });
  document.querySelectorAll('[data-nav]').forEach(function (a) { a.classList.toggle('is-active', a.getAttribute('data-nav') === cur); });
}

function route() {
  var h = '';
  try { h = decodeURIComponent(location.hash.replace('#', '')); } catch (e) { h = location.hash.replace('#', ''); }
  var p = bySlug(h);
  if (p) {
    app.innerHTML = project(p); view = 'project';
    document.title = p.title + ' · Cristian Figura';
    window.scrollTo({ top: 0, behavior: 'instant' });
    return;
  }
  var fresh = view !== 'home';
  if (fresh) { app.innerHTML = home(); view = 'home'; document.title = 'Cristian Figura · portfolio'; }
  var el = h && document.getElementById(h);
  if (el) { if (fresh) window.scrollTo({ top: 0, behavior: 'instant' }); el.scrollIntoView({ behavior: fresh ? 'instant' : 'smooth', block: 'start' }); }
  else if (fresh || !h) window.scrollTo({ top: 0, behavior: fresh ? 'instant' : 'smooth' });
  setActive();
}
window.addEventListener('hashchange', route);
route();

  syncFrames();
}
function syncFrames() {
  var t = document.documentElement.getAttribute('data-theme');
  document.querySelectorAll('.frame iframe').forEach(function (f) { try { f.contentWindow.postMessage({ type: 'theme', value: t }, '*'); } catch (e) {} });
}
app.addEventListener('click', function (e) {
  if (e.target.closest('#theme')) { setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); return; }
  var z = e.target.closest('[data-zoom]');
  if (z) { openLb(z.getAttribute('data-zoom'), z.getAttribute('data-alt'), z); return; }
  var m = e.target.closest('#copymail');
  if (m) {
    var done = function (t) { m.textContent = t; setTimeout(function () { m.textContent = 'Copia email'; }, 1800); };
    try { navigator.clipboard.writeText(EMAIL).then(function () { done('Copiata'); }, function () { done('Seleziona e copia'); }); }
    catch (err) { done('Seleziona e copia'); }
  }
});

/* lightbox */
var lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbclose = document.getElementById('lbclose'), lastBtn = null;
function openLb(src, alt, btn) { lbimg.src = src; lbimg.alt = alt || ''; lb.setAttribute('data-open', 'true'); lastBtn = btn; lbclose.focus(); }
function closeLb() { lb.removeAttribute('data-open'); lbimg.removeAttribute('src'); if (lastBtn && document.body.contains(lastBtn)) lastBtn.focus(); }
lbclose.addEventListener('click', closeLb);
lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && lb.getAttribute('data-open')) closeLb(); });
</script>
